<title>IMKAT Growth Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,100,400&display=swap">
<style>
:root{
  --bg:#F6F4F0; --panel:#FFFFFF; --panel-2:#FBFAF7;
  --ink:#2B2A28; --ink-2:#5C5852; --ink-3:#8A847B;
  --line:#E6E1D8; --line-2:#EFEBE4; --grid:#ECE8E1;
  --brand:#404040; --brand-ink:#FFFFFF; --sand:#D8B389; --sand-soft:#F3E9DC;
  --s1:#B8803F; --s2:#2A78D6; --s3:#1BAF7A; --s4:#4A3AA7; --s5:#E87BA4; --s6:#008300;
  --neutral:#B9B3AA;
  --good:#0B7A0B; --good-bg:#E4F3E4; --bad:#B42F2F; --bad-bg:#F8E3E1; --warn:#8A5A00; --warn-bg:#FCF0D4;
  --shadow:0 1px 2px rgba(40,34,26,.06),0 4px 16px rgba(40,34,26,.05);
  --r:10px;
  --f:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1B1A18; --panel:#252321; --panel-2:#2A2826;
    --ink:#F2EFEA; --ink-2:#C6C0B7; --ink-3:#958E84;
    --line:#3A3733; --line-2:#312F2C; --grid:#34312E;
    --brand:#2F2F2F; --brand-ink:#FFFFFF; --sand:#D8B389; --sand-soft:#3A3024;
    --s1:#BF8440; --s2:#3987E5; --s3:#199E70; --s4:#9085E9; --s5:#D55181; --s6:#008300;
    --neutral:#6E6860;
    --good:#5FCB5F; --good-bg:#1E3320; --bad:#F07A74; --bad-bg:#3A2220; --warn:#F2C35A; --warn-bg:#3A301A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B1A18; --panel:#252321; --panel-2:#2A2826;
  --ink:#F2EFEA; --ink-2:#C6C0B7; --ink-3:#958E84;
  --line:#3A3733; --line-2:#312F2C; --grid:#34312E;
  --brand:#2F2F2F; --brand-ink:#FFFFFF; --sand:#D8B389; --sand-soft:#3A3024;
  --s1:#BF8440; --s2:#3987E5; --s3:#199E70; --s4:#9085E9; --s5:#D55181; --s6:#008300;
  --neutral:#6E6860;
  --good:#5FCB5F; --good-bg:#1E3320; --bad:#F07A74; --bad-bg:#3A2220; --warn:#F2C35A; --warn-bg:#3A301A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s2);outline-offset:2px;border-radius:4px}

/* ---------- header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{width:30px;height:34px;flex:none}
.word{display:flex;flex-direction:column;line-height:.9}
.word b{font-weight:800;font-stretch:125%;font-size:22px;letter-spacing:.02em}
.word span{font-weight:700;font-stretch:125%;font-size:10.5px;letter-spacing:.32em;color:var(--sand)}
.brandrow .sub{font-size:12.5px;color:#CFCAC2;margin-left:auto;text-align:right}
.brandrow .sub strong{color:#fff;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:#D4CFC7;padding:10px 12px 12px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--sand)}

/* ---------- filters */
.filters{max-width:1320px;margin:0 auto;padding:14px 20px 4px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.chip{appearance:none;border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff}
.sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.sel select,.sel input{appearance:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 10px;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.sel input{padding-right:10px;background-image:none}
.range-label{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.range-label b{color:var(--ink);font-weight:600}
#custom[hidden]{display:none!important}

/* ---------- layout */
main{max-width:1320px;margin:0 auto;padding:10px 20px 48px}
.page{display:flex;flex-direction:column;gap:18px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}
.banner svg{flex:none;margin-top:2px;color:var(--warn)}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 -6px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:650;text-wrap:balance;letter-spacing:-.005em}
.card .hint{margin:3px 0 12px;color:var(--ink-3);font-size:12.5px}
.card.span2{grid-column:1/-1}

/* ---------- KPI tiles */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.kpi .lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:550}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;font-stretch:108%;line-height:1.1}
.kpi .val.na{color:var(--ink-3);font-size:20px;font-weight:600}
.kpi .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);min-height:18px}
.kpi.hero{background:var(--brand);border-color:var(--brand);color:#fff}
.kpi.hero .lab,.kpi.hero .foot{color:#D6D1C9}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:650;border-radius:5px;padding:1px 6px;font-size:11.5px}
.delta.good{color:var(--good);background:var(--good-bg)}
.delta.bad{color:var(--bad);background:var(--bad-bg)}
.delta.flat{color:var(--ink-2);background:var(--line-2)}
.kpi.hero .delta.good{background:rgba(95,203,95,.18);color:#9BE59B}
.kpi.hero .delta.bad{background:rgba(240,122,116,.18);color:#FFB0AA}
.kpi.hero .delta.flat{background:rgba(255,255,255,.12);color:#E6E1D9}
.info{position:relative;display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid currentColor;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:help;opacity:.7;flex:none;background:none;padding:0}
.info:hover,.info:focus-visible{opacity:1}
.low{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 5px}
.kpi.hero .low{background:rgba(242,195,90,.2);color:#F6D38A}

/* ---------- insights */
.insights{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ins{border-radius:var(--r);padding:14px 16px;background:var(--panel);border:1px solid var(--line);display:flex;gap:12px}
.ins .pill{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.ins.good .pill{background:var(--good-bg);color:var(--good)}
.ins.bad .pill{background:var(--bad-bg);color:var(--bad)}
.ins.do .pill{background:var(--sand-soft);color:var(--s1)}
.ins h4{margin:0 0 3px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ins p{margin:0;font-size:13.5px;color:var(--ink);text-wrap:pretty}

/* ---------- tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.total td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.muted{color:var(--ink-3)}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.tag.ready{background:var(--sand-soft);color:var(--ink)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:block;height:6px;border-radius:0 3px 3px 0;background:var(--s1);min-width:1px}

/* ---------- charts */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--f);font-size:11px}
.chart .v{fill:var(--ink-2);font-weight:600}
.chart .lbl{fill:var(--ink-2);font-size:12px}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.hit{fill:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.ln{height:2px;width:14px;border-radius:1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s}
#tip b{font-weight:700}
#tip .row{display:flex;gap:10px;justify-content:space-between}
#tip .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.fstep .fl{font-size:12.5px;color:var(--ink-2);font-weight:550}
.fstep .fb{position:relative;height:30px;background:var(--line-2);border-radius:6px;overflow:hidden}
.fstep .fb i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 6px 6px 0}
.fstep .fb b{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--ink);mix-blend-mode:normal}
.fstep .conv{grid-column:2;font-size:11.5px;color:var(--ink-3);margin-top:-6px}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}
.empty{padding:20px;text-align:center;color:var(--ink-3);font-size:13px}
.seg{display:inline-flex;background:var(--line-2);border-radius:8px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.health-list{display:flex;flex-direction:column}
.health-list div{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:center}
.health-list div:last-child{border-bottom:0}
.health-list p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
dl.gloss{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:0;margin:0}
dl.gloss dt{font-weight:650;padding:10px 12px 10px 0;border-bottom:1px solid var(--line-2)}
dl.gloss dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
dl.gloss code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--line-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
footer{max-width:1320px;margin:0 auto;padding:0 20px 32px;color:var(--ink-3);font-size:12px}
@media (max-width:640px){
  .top-in{padding:10px 16px 0}
  .filters,main,footer{padding-left:16px;padding-right:16px}
  .brandrow .sub{margin-left:0;text-align:left;width:100%}
  .kpi .val{font-size:22px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .fstep{grid-template-columns:90px 1fr}
  dl.gloss{grid-template-columns:1fr}
  dl.gloss dt{border-bottom:0;padding-bottom:0}
  .range-label{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <svg class="mark" viewBox="0 0 30 34" aria-hidden="true">
        <path d="M15 1 29 9v16l-14 8L1 25V9z" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
        <path d="M15 9.5 21.8 13.4v7.8L15 25.1l-6.8-3.9v-7.8z" fill="none" stroke="#D8B389" stroke-width="2.2"/>
        <circle cx="15" cy="17.3" r="2.6" fill="#FFFFFF"/>
      </svg>
      <div class="word"><b>IMKAT</b><span>HOMES</span></div>
      <div class="sub">Growth dashboard · GoHighLevel data as of <strong id="asof">—</strong></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Dashboard pages" id="tabs"></nav>
  </div>
</header>

<section class="filters" aria-label="Filters">
  <div class="chips" id="presets" role="group" aria-label="Date range"></div>
  <div id="custom" hidden style="display:flex;gap:8px">
    <label class="sel">From <input type="date" id="dFrom"></label>
    <label class="sel">To <input type="date" id="dTo"></label>
  </div>
  <label class="sel">Source <select id="fCh"></select></label>
  <label class="sel">Rep <select id="fRep"></select></label>
  <label class="sel">Region <select id="fRg"></select></label>
  <div class="range-label" id="rangeLabel"></div>
</section>

<main id="main"><div class="empty">Loading dashboard data…</div></main>
<footer id="foot"></footer>
<div id="tip" role="tooltip"></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- formatting */
const fmtN = v => v == null || !isFinite(v) ? "—" : Math.round(v).toLocaleString("en-US");
const fmtP = v => v == null || !isFinite(v) ? "—" : (v * 100).toFixed(1) + "%";
const fmt$ = v => {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return "$" + (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
  if (a >= 1e4) return "$" + Math.round(v / 1e3) + "K";
  if (a >= 1e3) return "$" + (v / 1e3).toFixed(1) + "K";
  return "$" + Math.round(v).toLocaleString("en-US");
};
const fmt$full = v => v == null || !isFinite(v) ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const fmtMin = m => m == null ? "—" : m < 60 ? Math.round(m) + " min" : m < 1440 ? (m / 60).toFixed(1) + " hrs" : (m / 1440).toFixed(1) + " days";
const div = (a, b) => b ? a / b : null;
const LOWN = 10;

/* ---------------- dates */
const D = s => new Date(s + "T12:00:00");
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5) + 1;
const niceDate = s => D(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const monLabel = m => new Date(m + "-15T12:00:00").toLocaleDateString("en-US", { month: "short", year: "2-digit" });

/* ---------------- constants */
const PAGES = [
  ["overview", "Executive summary"], ["sources", "Marketing sources"], ["sales", "Sales team"],
  ["speed", "Speed to lead"], ["pipeline", "Pipeline"], ["markets", "Markets & product"],
  ["health", "Data health"], ["glossary", "Glossary"]];
const REP_COLOR = { David: "var(--s1)", Avenir: "var(--s2)", Eugene: "var(--s3)", James: "var(--s4)" };
const RG_COLOR = { "Sacramento": "var(--s1)", "Bay Area": "var(--s2)", "Outside core markets": "var(--neutral)", "Unknown": "var(--neutral)" };
const CH_ORDER = ["Meta Ads", "Google Ads", "Organic / SEO", "Google Business Profile", "Organic Social", "Events",
  "Website (no source)", "YouTube Ads", "Nextdoor", "Referral", "Phone (inbound)", "TV", "5K Promo (channel unknown)", "Offline / Other", "Other", "Unattributed"];
const PAID = new Set(["Meta Ads", "Google Ads"]);
const GROUP_LABEL = { ready: "Ready to sign", pre: "Before estimate", hold: "On hold / timing", unq: "Unqualified" };
const GROUP_COLOR = { ready: "var(--s1)", pre: "var(--s2)", hold: "var(--neutral)" };
const SPEED_BUCKETS = [["<5 min", 0, 5], ["5–15 min", 5, 15], ["15–60 min", 15, 60], ["1–24 hrs", 60, 1440], ["24+ hrs", 1440, Infinity]];

const state = { page: "overview", preset: "ytd", from: null, to: null, ch: "", rep: "", rg: "", closeBasis: "period" };
try { const s = JSON.parse(localStorage.getItem("imkat-dash") || "{}"); Object.assign(state, s.preset ? { preset: s.preset, ch: s.ch || "", rep: s.rep || "", rg: s.rg || "", closeBasis: s.closeBasis || "period", from: s.from, to: s.to } : {}); } catch (e) {}
const tokenPage = (location.hash || "").slice(1);
if (PAGES.some(p => p[0] === tokenPage)) state.page = tokenPage;
const save = () => { try { localStorage.setItem("imkat-dash", JSON.stringify({ preset: state.preset, ch: state.ch, rep: state.rep, rg: state.rg, closeBasis: state.closeBasis, from: state.from, to: state.to })); } catch (e) {} };

let DATA = null;

/* ---------------- tooltip */
const tip = $("#tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (t) showTip(t.getAttribute("data-tip"), e.clientX, e.clientY); else if (!e.target.closest("[data-xhair]")) hideTip();
});
document.addEventListener("focusin", e => {
  const t = e.target.closest("[data-tip]");
  if (t) { const r = t.getBoundingClientRect(); showTip(t.getAttribute("data-tip"), r.right, r.bottom); }
});
document.addEventListener("focusout", hideTip);
const tipRows = (title, rows) => `<b>${esc(title)}</b>` + rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");

/* ---------------- range */
function range() {
  const today = DATA.today, y = today.slice(0, 4), m = today.slice(0, 7);
  const q = Math.floor((+today.slice(5, 7) - 1) / 3) * 3 + 1;

    "7d": [addDays(today, -6), today], "30d": [addDays(today, -29), today], "90d": [addDays(today, -89), today],

  const counts = names.map(n => L.filter(r => bucketOf(r) === n).length);

  const att = L.filter(r => r.spd != null).map(r => r.a48), attAvg = att.length ? att.reduce((a, b) => a + b, 0) / att.length : null;
  const byWho = groupBy(L.filter(r => r.by), "by");
  const whoRows = Object.entries(byWho).filter(([, v]) => v.length >= 5).map(([k, v]) => ({ k, n: v.length, med: med(v), in5: in5(v), a48: v.reduce((t, r) => t + r.a48, 0) / v.length })).sort((a, b) => b.n - a.n);
  const tiles = [
    kpi({ label: "Median speed to lead", value: med(L), prev: med(P), fmt: fmtMin, goodUp: false, n: L.length, tipText: "Median time from lead creation to the first human outbound call, text or DM (GHL app/mobile). Automated workflow and bulk messages are excluded, and so are third-party API messages until you confirm what they are." }),
    kpi({ label: "Average speed to lead", value: avg(L), prev: avg(P), fmt: fmtMin, goodUp: false, tipText: "Mean of the same measure, leaving out leads first reached 30+ days later so a few stale leads don't swamp it." }),
    kpi({ label: "Contacted within 5 min", value: in5(L), prev: in5(P), fmt: fmtP, pct: true, tipText: "Share of qualified leads with a human outbound touch under 5 minutes." }),
    kpi({ label: "Never contacted by a person", value: never(L), prev: never(P), fmt: fmtP, pct: true, goodUp: false, tipText: "Share of qualified leads with no human outbound message logged in GHL (they may have received automations only)." }),
    kpi({ label: "Attempts in first 48 hrs", value: attAvg, prev: null, fmt: v => v.toFixed(1), tipText: "Average number of human outbound calls/texts in the 48 hours after lead creation, for leads that were contacted." })
  ];
  const dist = hbars(names.map((n, i) => ({ label: n, value: counts[i], color: n === "Never contacted" ? "var(--neutral)" : "var(--s1)", display: `${fmtN(counts[i])} · ${fmtP(div(counts[i], L.length))}` })), { labelW: 120, tipFn: r => tipRows(r.label, [["Leads", fmtN(r.value)], ["Share", fmtP(div(r.value, L.length))]]) });
  const hrs = `<div class="tw"><table><thead><tr><th class="l">Lead arrived</th><th>Leads</th><th>Median</th><th>&lt;5 min</th><th>Never contacted</th></tr></thead><tbody>
    ${[["Business hours", bh], ["After hours / weekend", ah]].map(([n, a]) => `<tr><td class="l">${n}</td><td>${fmtN(a.length)}</td><td>${fmtMin(med(a))}</td><td>${fmtP(in5(a))}</td><td>${fmtP(never(a))}</td></tr>`).join("")}
  </tbody></table></div><p class="note">Business hours assumed Mon–Fri 8am–6pm PT — tell me yours and I'll update it.</p>`;
  const who = `<div class="tw"><table><thead><tr><th class="l">First responder</th><th>Leads</th><th>Median</th><th>&lt;5 min</th><th>Attempts / 48 hrs</th></tr></thead><tbody>
    ${whoRows.map(r => `<tr><td class="l">${esc(r.k)}</td><td>${fmtN(r.n)}</td><td>${fmtMin(r.med)}</td><td>${fmtP(r.in5)}</td><td>${r.a48.toFixed(1)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No responder data in this range.</td></tr>`}
  </tbody></table></div><p class="note">Who sent the first human message. The closers (David, James, Eugene, Avenir) rarely message from GHL, so this measures inside sales.</p>`;
  const bk = buckets(R.from, R.to);
  const trend = lines(bk.map(k => k.label), [{ name: "Median minutes", color: "var(--s1)", values: bk.map(k => med(L.filter(r => r.d >= k.a && r.d <= k.b))) }], { fmt: v => fmtMin(v), H: 200 });
  return bannerIfOld(R) + `<div class="grid g-kpi">${tiles.join("")}</div>
    <div class="grid g-2">
      <div class="card"><h3>How fast does a person reach new leads?</h3><p class="hint">Qualified leads by time to first human call/text.</p>${dist}</div>
      <div class="card"><h3>Is response time getting faster?</h3><p class="hint">Median speed to lead per ${bk[0] && bk[0].m ? "month" : "week"}.</p>${trend}</div>
    </div>
    <div class="grid g-2">
      <div class="card"><h3>Do after-hours leads wait longer?</h3><p class="hint">Split by when the lead arrived.</p>${hrs}</div>
      <div class="card"><h3>Who answers new leads first?</h3><p class="hint">First human responder, 5+ leads.</p>${who}</div>
    </div>
    <div class="banner">${I.warn}<div>Booking and close rate by speed bucket (proof that fast response pays) comes next — it needs your call on the 9,619 third-party "API" messages (SendBlue / dialer?) so the buckets are right.</div></div>`;
}

function pagePipeline(R) {
  const op = openDeals(), m = metrics(R.from, R.to);
  const order = Object.values(op.reduce((o, r) => { (o[r.st] = o[r.st] || { st: r.st, sp: r.sp, g: r.g, n: 0, v: 0, age: [] }); o[r.st].n++; o[r.st].v += r.v; o[r.st].age.push(r.age); return o; }, {})).sort((a, b) => a.sp - b.sp);
  const stageTable = `<div class="tw"><table><thead><tr><th class="l">Stage</th><th class="l">Group</th><th>Deals</th><th>Value</th><th>Median days in stage</th><th>60+ days</th></tr></thead><tbody>
    ${order.map(s => { const a = s.age.sort((x, y) => x - y); const md = a[Math.floor(a.length / 2)]; return `<tr><td class="l">${esc(s.st)}</td><td class="l"><span class="tag ${s.g === "ready" ? "ready" : ""}">${GROUP_LABEL[s.g] || "Other"}</span></td><td>${fmtN(s.n)}</td><td><div class="bar-cell">${fmt$(s.v)}<i style="width:${Math.round(60 * s.v / Math.max(...order.map(o => o.v), 1))}px"></i></div></td><td>${md}</td><td>${a.filter(x => x > 60).length}</td></tr>`; }).join("")}
    <tr class="total"><td class="l">Total open</td><td></td><td>${fmtN(op.length)}</td><td>${fmt$(op.reduce((t, r) => t + r.v, 0))}</td><td></td><td>${op.filter(r => r.age > 60).length}</td></tr>
  </tbody></table></div>`;
  const stuck = op.filter(r => r.g === "ready" && r.age > 30).sort((a, b) => b.v - a.v);
  const stuckT = `<div class="tw"><table><thead><tr><th class="l">Client</th><th class="l">Rep</th><th class="l">Stage</th><th>Value</th><th>Days in stage</th><th class="l">Region</th><th class="l">Source</th></tr></thead><tbody>
    ${stuck.slice(0, 40).map(r => `<tr><td class="l">${esc(r.nm)}</td><td class="l"><span class="sw" style="background:${REP_COLOR[r.rep] || "var(--neutral)"}"></span>${esc(r.rep)}</td><td class="l">${esc(r.st)}</td><td>${fmt$(r.v)}</td><td><span class="tag ${r.age > 90 ? "bad" : "warn"}">${r.age}</span></td><td class="l">${esc(r.rg)}</td><td class="l muted">${esc(r.ch)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No stuck deals for this filter.</td></tr>`}
  </tbody></table></div>${stuck.length > 40 ? `<p class="note">Showing the 40 largest of ${stuck.length}.</p>` : ""}`;
  const lr = groupBy(m.lost, "lr"); const lrRows = Object.entries(lr).map(([k, v]) => ({ label: k === "null" ? "No reason given" : k, value: v.length, color: k === "null" ? "var(--neutral)" : "var(--s1)" })).sort((a, b) => b.value - a.value);
  const lostCh = groupBy(m.lost, "ch");
  const lostChRows = Object.entries(lostCh).map(([k, v]) => ({ label: k, value: v.length, v: v.reduce((t, r) => t + r.v, 0) })).sort((a, b) => b.value - a.value).slice(0, 8);
  return bannerIfOld(R) + `<div class="grid g-kpi">
      ${kpi({ label: "Open pipeline (unweighted)", value: op.reduce((t, r) => t + r.v, 0), prev: null, fmt: fmt$, sub: `<span>${fmtN(op.length)} deals · today</span>`, tipText: "All open Sales Pipeline deals at their GHL monetary value. Not weighted — GHL's stage probabilities are its evenly-spaced defaults, so a forecast waits on real probabilities from you." })}
      ${kpi({ label: "Ready to sign", value: op.filter(r => r.g === "ready").reduce((t, r) => t + r.v, 0), prev: null, fmt: fmt$, hero: true, sub: `<span>${fmtN(op.filter(r => r.g === "ready").length)} deals</span>`, tipText: "Open deals in estimate-delivered stages." })}
      ${kpi({ label: "Stuck 30+ days (ready)", value: stuck.reduce((t, r) => t + r.v, 0), prev: null, fmt: fmt$, sub: `<span>${fmtN(stuck.length)} deals</span>`, tipText: "Ready-to-sign deals whose stage hasn't changed in 30+ days." })}
      ${kpi({ label: "On hold / timing", value: op.filter(r => r.g === "hold").reduce((t, r) => t + r.v, 0), prev: null, fmt: fmt$, sub: `<span>${fmtN(op.filter(r => r.g === "hold").length)} deals</span>`, tipText: "Timing/Future and both On Hold stages." })}
      ${kpi({ label: "Lost in period", value: m.nLost, prev: metrics(R.pFrom, R.pTo).nLost, fmt: fmtN, goodUp: false, sub: `<span>${fmt$(m.lost.reduce((t, r) => t + r.v, 0))}</span>`, tipText: "Sales Pipeline deals marked Lost in the period (status change date)." })}
    </div>
    <div class="card"><h3>Which ready-to-sign deals are stuck?</h3><p class="hint">Estimate delivered, no stage change in 30+ days — largest first. Names shortened for privacy.</p>${stuckT}</div>
    <div class="grid g-2">
      <div class="card"><h3>Where is open pipeline sitting?</h3><p class="hint">Open Sales Pipeline by current stage, today.</p>${stageTable}</div>
      <div class="card"><h3>Why are deals lost?</h3><p class="hint">Lost in period by reason. ${fmtP(div(m.lost.filter(r => !r.lr).length, m.nLost))} have no reason — make it required in GHL.</p>${hbars(lrRows, { labelW: 190 })}
        <h3 style="margin-top:18px">Where did lost deals come from?</h3><p class="hint">Lost deals by original source.</p>${hbars(lostChRows.map(r => ({ ...r, color: "var(--s2)" })), { labelW: 190, tipFn: r => tipRows(r.label, [["Lost deals", fmtN(r.value)], ["Value", fmt$(r.v)]]) })}</div>
    </div>
    <div class="banner">${I.warn}<div>30/60/90-day forecast is switched off: GHL's stage probabilities are evenly-spaced defaults (it lists Lost at 96%). Send real win probabilities per stage and the forecast turns on.</div></div>`;
}

function pageMarkets(R) {
  const m = metrics(R.from, R.to), op = openDeals();
  const rgs = ["Sacramento", "Bay Area", "Outside core markets", "Unknown"];
  const row = g => { const l = m.qleads.filter(r => r.rg === g), a = m.appts.filter(r => r.rg === g), w = m.won.filter(r => r.rg === g), lo = m.lost.filter(r => r.rg === g), o = op.filter(r => r.rg === g && r.g === "ready"); const rev = w.reduce((t, r) => t + r.v, 0), sp = state.rep ? null : (() => { const s = state.rg; state.rg = g; const v = spendFor(R.from, R.to); state.rg = s; return v; })();
    return { g, l: l.length, a: a.length, w: w.length, lo: lo.length, rev, ready: o.reduce((t, r) => t + r.v, 0), sp, avg: div(w.filter(r => r.v > 0).reduce((t, r) => t + r.v, 0), w.filter(r => r.v > 0).length) }; };
  const rows = rgs.map(row).filter(r => r.l + r.a + r.w + r.lo);
  const tbl = `<div class="tw"><table><thead><tr><th class="l">Region</th><th>Leads</th><th>Appts</th><th>Lead→appt</th><th>Won</th><th>Revenue</th><th>Avg deal</th><th>Close rate</th><th>Win rate</th><th>Lost</th><th>Ready to sign</th><th>Paid spend</th><th>ROAS (all rev.)</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="l"><span class="sw" style="background:${RG_COLOR[r.g]}"></span><b>${r.g}</b></td><td>${fmtN(r.l)}</td><td>${fmtN(r.a)}</td><td>${fmtP(div(r.a, r.l))}</td><td>${fmtN(r.w)} ${low(r.w)}</td><td>${fmt$(r.rev)}</td><td>${fmt$(r.avg)}</td><td>${fmtP(div(r.w, r.a))}</td><td>${fmtP(div(r.w, r.w + r.lo))}</td><td>${fmtN(r.lo)}</td><td>${fmt$(r.ready)}</td><td>${r.sp ? fmt$(r.sp) : "—"}</td><td>${r.sp ? (r.rev / r.sp).toFixed(1) + "×" : "—"}</td></tr>`).join("")}
  </tbody></table></div><p class="note">Region order: GHL "Sacramento Or Bay Area" field → property-address ZIP → contact ZIP → campaign name → phone area code (estimate). Solano County counts as Bay Area. ROAS here divides all revenue won in the region by Meta + Google spend there.</p>`;

  const revLines = lines(bk.map(k => k.label), ["Sacramento", "Bay Area"].map(g => ({ name: g, color: RG_COLOR[g], values: countIn(m.won.filter(r => r.rg === g), bk, r => r.v) })), { fmt: fmt$ });
  const pt = groupBy(m.won, "pt"); const ptRows = Object.entries(pt).map(([k, v]) => ({ label: k, value: v.length, rev: v.reduce((t, r) => t + r.v, 0), color: k === "Unknown" ? "var(--neutral)" : "var(--s1)" })).sort((a, b) => b.value - a.value);
  const fn = groupBy(m.won, "fn"); const fnRows = Object.entries(fn).map(([k, v]) => ({ label: k, value: v.length, color: k === "Unknown" ? "var(--neutral)" : "var(--s2)" })).sort((a, b) => b.value - a.value);
  const mo = groupBy(m.won, "mo"); const moRows = Object.entries(mo).map(([k, v]) => ({ label: k, value: v.length, color: k === "Unknown" ? "var(--neutral)" : "var(--s3)" })).sort((a, b) => b.value - a.value);
  const city = groupBy(m.won.filter(r => r.city), "city"); const cityRows = Object.entries(city).map(([k, v]) => ({ label: k, value: v.reduce((t, r) => t + r.v, 0), n: v.length })).sort((a, b) => b.value - a.value).slice(0, 12);
  const unknownShare = (rows2, total) => { const u = rows2.find(r => r.label === "Unknown"); return u ? ` ${fmtP(u.value / total)} not filled in.` : ""; };
  return bannerIfOld(R) + `<div class="card span2"><h3>How does the Bay Area compare with Sacramento?</h3><p class="hint">Every metric by region, same period.</p>${tbl}</div>
    <div class="grid g-2">
      <div class="card"><h3>Which market is signing more revenue over time?</h3><p class="hint">Revenue won per ${bk[0] && bk[0].m ? "month" : "week"}.</p>${legend([["Sacramento", RG_COLOR.Sacramento, 1], ["Bay Area", RG_COLOR["Bay Area"], 1]])}${revLines}</div>
      <div class="card"><h3>Which cities sign the most?</h3><p class="hint">Top 12 cities by revenue won (from property address).</p>${hbars(cityRows.map(r => ({ ...r, color: "var(--s1)" })), { fmt: fmt$, labelW: 130, tipFn: r => tipRows(r.label, [["Revenue", fmt$full(r.value)], ["Jobs", fmtN(r.n)]]) })}</div>
    </div>
    <div class="grid g-3">
      <div class="card"><h3>What are clients building?</h3><p class="hint">Jobs won by project type.${unknownShare(ptRows, m.nWon)}</p>${hbars(ptRows, { labelW: 130, tipFn: r => tipRows(r.label, [["Jobs", fmtN(r.value)], ["Revenue", fmt$(r.rev)]]) })}</div>
      <div class="card"><h3>How are jobs being paid for?</h3><p class="hint">Jobs won by funding.${unknownShare(fnRows, m.nWon)}</p>${hbars(fnRows, { labelW: 130 })}</div>
      <div class="card"><h3>Why are homeowners building?</h3><p class="hint">Jobs won by motivation.${unknownShare(moRows, m.nWon)} ${low(m.won.filter(r => r.mo !== "Unknown").length)}</p>${hbars(moRows, { labelW: 130 })}</div>
    </div>
    <div class="banner">${I.warn}<div>Events (open houses, seminars) are out of scope for now — you're only using the Lead and Sales pipelines. Event-sourced leads still show up under "Events" on the Sources page.</div></div>`;
}

function pageHealth() {
  const h = DATA.health;
  const mo = h.month.filter(r => r.m >= "2025-01");
  const cov = lines(mo.map(r => monLabel(r.m)), [{ name: "Leads with a source", color: "var(--s1)", values: mo.map(r => r.att) }, { name: "Leads with a region", color: "var(--s2)", values: mo.map(r => r.reg) }], { fmt: fmtP, pctAxis: true, H: 220 });
  const st = h.appt_status, stTot = Object.values(st).reduce((a, b) => a + b, 0);
  const items = [
    ["Won deals with no source", "bad", `${fmtP(1 - (mo.slice(-9).reduce((t, r) => t + r.att * r.n, 0) / Math.max(1, mo.slice(-9).reduce((t, r) => t + r.n, 0))))} of recent leads have no source. GHL's own UTM / click-ID tracking is filled on under 1% of contacts.`, "Fix: map UTM hidden fields on every form and pass source from Meta Lead Ads."],
    ["Lost deals with no reason", "bad", `${fmtN(h.lost_no_reason)} of ${fmtN(h.lost_total)} lost Sales deals (${fmtP(h.lost_no_reason / h.lost_total)}).`, "Fix: make lost reason required when a deal is marked Lost."],
    ["Won deals with $0 value", "warn", `${fmtN(h.won_no_value)} of ${fmtN(h.won_total)} — left out of revenue and average deal.`, "Fix: enter the contract value when marking Won."],
    ["Unassigned Sales deals", "warn", `${fmtN(h.sales_unassigned)} of ${fmtN(h.sales_total)} Sales Pipeline deals have no owner (or a deleted user).`, "Fix: assign every deal to a closer."],
    ["Unassigned Lead Pipeline leads", "warn", `${fmtN(h.lead_unassigned)} of ${fmtN(h.lead_total)}.`, "Fix: round-robin assignment in the new-lead workflow."],
    ["Bulk status updates", "warn", h.bulk_days.map(b => `${b.won} wins on ${niceDate(b.d)}`).join(" · ") + ".", "Won dates on those days aren't real signing dates. From launch, daily snapshots lock in the first won date."],
    ["Free-text sources", "warn", `${fmtN(h.distinct_sources)} different source spellings on Lead/Sales deals, mapped into ~12 channels.`, "Fix: use a dropdown for source instead of free text."]
  ];
  const wf = Object.entries(h.won_fields).map(([k, v]) => ({ label: k.replace("Homeowners Motivation To Build an ADU", "Motivation"), value: v, color: v >= 0.8 ? "var(--s3)" : v >= 0.5 ? "var(--s1)" : "var(--neutral)" }));
  return `<div class="grid g-2">

        <p class="note">Region for 2026 leads: ${Object.entries(h.region_basis).map(([k, v]) => `${k} ${fmtN(v)}`).join(" · ")}. "Phone area code" is an estimate (84% accurate in testing).</p></div>
      <div class="card"><h3>Which data problems cost us accuracy?</h3><p class="hint">Open issues, most impactful first.</p><div class="health-list">
        ${items.map(([t, c, d, f]) => `<div><div><b>${esc(t)}</b><p>${esc(d)}</p><p>${esc(f)}</p></div><span class="tag ${c}">${c === "bad" ? "High" : "Medium"}</span></div>`).join("")}
      </div></div>

    <div class="grid g-2">

      <div class="card"><h3>Are appointments being updated?</h3><p class="hint">Past appointments by GHL status. You said confirmed = booked, which is fine; show/no-show isn't tracked.</p>
        ${hbars(Object.entries(st).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v, display: `${fmtN(v)} · ${fmtP(v / stTot)}`, color: "var(--s2)" })), { labelW: 110 })}</div>

function pageGlossary() {
  const g = [
    ["Lead", "A contact whose first Lead Pipeline or Sales Pipeline deal — or first walkthrough booking — falls in the period. <b>Qualified</b> excludes deals in Fake/Spam Number, Outside Service or No Property."],
    ["Appointment", "A walkthrough booking (any walkthrough calendar) assigned to David, James, Eugene or Avenir, counted on its appointment date, excluding cancelled/invalid. GHL status “confirmed” = booked."],
    ["Job won", "Sales Pipeline deal with status <code>won</code>, dated by <code>lastStatusChangeAt</code>. Counted per deal, so multi-unit clients count once per deal."],
    ["Revenue won", "Sum of GHL monetary value on jobs won. $0-value wins are counted as jobs but add no revenue."],
    ["Close rate", "<b>Same period:</b> jobs won in range ÷ appointments in range. <b>Appointment cohort:</b> appointments in range whose client later signed a deal ÷ appointments in range."],
    ["Win rate", "Won ÷ (won + lost), for deals closed in range."],
    ["Lead → appointment", "Appointments ÷ qualified leads, same period (lead quality)."],
    ["Average deal", "Revenue won ÷ jobs won with a value above $0."],
    ["Days to close", "Median days from lead creation to won date."],
    ["Ready to sign", "Open Sales deals in Estimate Ready (Sales), Proposal Sent to Client, Contact Made/ Pending, Review W/Decision Makers, Looking at Bids, Financing, Review price, Last Chance, New Inside, In-Bound Calls."],
    ["Before estimate", "Walkthrough Scheduled, Walkthrough Completed, Ready for Estimate (BT), Estimate Needs Revision."],
    ["On hold / timing", "Timing/ Future, On Hold (0 - 6 months), On Hold (More Than 6 Months). Unqualified Lead is excluded from pipeline value."],
    ["Stuck / stale", "Ready-to-sign deal with no stage change in 30+ days."],
    ["Source (channel)", "The lead's <b>original</b> source: the earliest non-empty source on any of their Lead/Sales deals, else the contact source or landing-page UTM. ~990 raw spellings are mapped to channels by fixed rules (<code>etl/mapping.py</code>). No source = <b>Unattributed</b>, never guessed."],
    ["Region", "Priority: GHL “Sacramento Or Bay Area” field → property-address ZIP → contact ZIP → campaign name → phone area code (estimate). Solano County = Bay Area; Stockton/Modesto = Outside core markets."],
    ["Paid ad spend", "Meta + Google Ads from the IMKAT ADs Report sheet (Jan–Jul 2026 actuals), prorated by day. Billboard, TV and events are excluded. Switches to the platform APIs once connected."],
    ["CPL / cost per appointment / cost per job", "Paid spend ÷ qualified leads, appointments or jobs whose original source is Meta or Google."],
    ["ROAS", "Revenue won from Meta/Google-sourced deals ÷ Meta + Google spend, same period."],
    ["Speed to lead", "Minutes from lead creation to the first <b>human</b> outbound call, text or DM (GHL <code>source = app</code>). Workflow and bulk messages are excluded; third-party API messages are excluded until confirmed."],
    ["Attempts in 48 hrs", "Human outbound calls/texts in the 48 hours after lead creation."],
    ["Low confidence", "Any figure built on fewer than 10 records is flagged <span class=\"low\">low n</span>."],
    ["% change", "Compared with the previous period of the same length, immediately before the selected range."]
  ];
  return `<div class="card"><h3>How is every number calculated?</h3><p class="hint">Definitions used across the dashboard.</p><dl class="gloss">${g.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join("")}</dl></div>`;
}

/* ---------------- render */
function render() {
  const R = range();
  $("#rangeLabel").innerHTML = `<b>${niceDate(R.from)} – ${niceDate(R.to)}</b> · vs ${niceDate(R.pFrom)} – ${niceDate(R.pTo)}`;
  $("#custom").hidden = state.preset !== "custom";
  document.querySelectorAll("#presets .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === state.preset));
  document.querySelectorAll("#tabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.page === state.page));
  const f = { overview: pageOverview, sources: pageSources, sales: pageSales, speed: pageSpeed, pipeline: pagePipeline, markets: pageMarkets, health: pageHealth, glossary: pageGlossary }[state.page];
  $("#main").innerHTML = `<div class="page">${f(R)}</div>`;
  $("#main").querySelectorAll("[data-basis]").forEach(b => b.addEventListener("click", () => { state.closeBasis = b.dataset.basis; save(); render(); }));
}
function init() {
  $("#asof").textContent = DATA.generated;
  $("#tabs").innerHTML = PAGES.map(([k, n]) => `<button class="tab" role="tab" type="button" data-page="${k}">${n}</button>`).join("");
  $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; state.page = b.dataset.page; history.replaceState(null, "", "#" + state.page); render(); window.scrollTo({ top: 0 }); });
  $("#presets").innerHTML = PRESETS.map(([k, n]) => `<button class="chip" type="button" data-p="${k}">${n}</button>`).join("");
  $("#presets").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.preset = b.dataset.p; save(); render(); });
  const chs = CH_ORDER.filter(c => DATA.leads.some(r => r.ch === c));
  $("#fCh").innerHTML = `<option value="">All sources</option>` + chs.map(c => `<option>${esc(c)}</option>`).join("");
  $("#fRep").innerHTML = `<option value="">All reps</option>` + DATA.reps.map(r => `<option>${r}</option>`).join("");
  $("#fRg").innerHTML = `<option value="">All regions</option>` + ["Sacramento", "Bay Area", "Outside core markets", "Unknown"].map(r => `<option>${r}</option>`).join("");
  [["#fCh", "ch"], ["#fRep", "rep"], ["#fRg", "rg"]].forEach(([s, k]) => { const el = $(s); el.value = state[k]; el.addEventListener("change", () => { state[k] = el.value; save(); render(); }); });
  const R0 = range(); $("#dFrom").value = state.from || R0.from; $("#dTo").value = state.to || R0.to;
  ["#dFrom", "#dTo"].forEach(s => $(s).addEventListener("change", () => { state.from = $("#dFrom").value; state.to = $("#dTo").value; if (state.from > state.to) [state.from, state.to] = [state.to, state.from]; save(); render(); }));
  $("#foot").innerHTML = `Source: GoHighLevel (Lead + Sales pipelines, walkthrough calendars, conversations) · Ad spend: IMKAT ADs Report sheet until the Google Ads & Meta APIs are connected · Built by Foreign Media.`;
  render();
}
fetch("data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; init(); })
  .catch(err => { $("#main").innerHTML = `<div class="empty">Couldn't load dashboard data (${esc(err.message)}). Reload the page to try again.</div>`; });
})();
</script>
